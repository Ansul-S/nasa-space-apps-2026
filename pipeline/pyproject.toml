[project]
name = "analog-pipeline"
version = "0.1.0"
description = "Calculates seasonal Earth analog conditions, sun windows and campaign odds for lunar South Pole test sites."
requires-python = ">=3.11"
dependencies = [
    "earthaccess>=0.17.0",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "xarray>=2026.9.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
